<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relatório Semanal - Effico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOPO -->
  <header class="topo">
    <img src="assets/Effico_logo.png" alt="Effico Saneamento" class="logo">
    <div>
      <h1>Relatório Semanal de Contratos</h1>
      <span id="gerenteNome"></span>
    </div>
  </header>

  <main class="container">

    <section class="conteudo">
      <div id="formulario"></div>

      <button id="btnEnviar" class="btn-enviar">
        Enviar Relatório
      </button>

      <p id="erro" class="erro"></p>
    </section>

    <aside class="historico">
      <h3>📊 Histórico</h3>
      <input type="date" id="dataHistorico">
      <button onclick="carregarHistorico()">Buscar</button>
      <div id="listaHistorico">Selecione uma data</div>
    </aside>

  </main>

  <footer class="rodape">
    <p>
      Desenvolvido Pela Equipe <strong> Financial Planning and Analysis (FP&A) </strong> •
      Para Suporte - planejamento@effico.com.br
    </p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
